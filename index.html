<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <!-- Thư viện biểu tượng FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header id="site-header"></header>
    <main id="app"></main>
    <footer id="site-footer"></footer>

      <!-- Khung Chatbox AI hỗ trợ tạo thương hiệu mới (nằm dưới nút mũi tên góc phải) -->
  

    <!-- Nút chuyển đổi White Label (Góc dưới trái) -->
    <div class="white-label-switcher">
      <button id="wl-toggle-btn" class="wl-btn" aria-label="Switch White Label Brand">
        <i class="fa-solid fa-swatchbook"></i> <span id="wl-brand-name">Đổi Giao Diện</span>
      </button>
      <div class="wl-menu" id="wl-menu">
        <div class="wl-menu-title">Chọn giao diện White Label:</div>
        <button class="wl-menu-item" data-brand="brand-vivoice">
          <i class="fa-solid fa-microphone-lines"></i> ViVoice (AI Voice)
        </button>
        <button class="wl-menu-item" data-brand="brand-cybertone">
          <i class="fa-solid fa-gamepad"></i> CyberTone (Game NPC)
        </button>
        <button class="wl-menu-item" data-brand="brand-omniclarity">
          <i class="fa-solid fa-headset"></i> OmniClarity (CSKH &amp; Y Tế)
        </button>
      </div>
    </div>

    <!-- Thư viện đồ họa 3D Three.js và Animation GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Script chính của ứng dụng -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
